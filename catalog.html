<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог ПК — CyberForge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="container nav">
      <a href="index.html" class="logo">CYBER<span>FORGE</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Головна</a></li>
        <li><a href="catalog.html" class="active">Каталог</a></li>
        <li><a href="contacts.html">Контакти</a></li>
      </ul>
      <div id="userArea" class="user-panel"></div>
    </div>
  </header>

  <div class="container catalog-page">
    <h1 style="margin: 1.5rem 0 0.5rem 0;">Каталог ігрових та робочих станцій</h1>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">Знайдено моделей: <span id="countDisplay" style="color: var(--accent); font-weight: bold;">20</span></p>

    <div class="catalog-layout">
      <!-- ФИЛЬТР САЙДБАР -->
      <aside class="filter-sidebar">
        <h3>Розумний Фільтр</h3>
        
        <div class="filter-group">
          <label for="searchTxt">Пошук по комплектації (CPU/GPU)</label>
          <input type="text" id="searchTxt" placeholder="Наприклад: RTX 4070 або Ryzen...">
        </div>

        <div class="filter-group">
          <label for="catSelect">Конфігурація</label>
          <select id="catSelect">
            <option value="all">Усі категорії</option>
            <option value="gaming">Геймінг</option>
            <option value="work">Робота і 3D</option>
            <option value="budget">Бюджетні</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Діапазон ціни (₴)</label>
          <div class="price-inputs">
            <input type="number" id="minPrice" placeholder="Від: 0">
            <input type="number" id="maxPrice" placeholder="До: 160000">
          </div>
        </div>

        <button class="btn" style="width: 100%; margin-bottom: 0.5rem;" onclick="applyFilters()">Застосувати фільтр</button>
        <button class="btn btn-secondary" style="width: 100%;" onclick="resetFilters()">Скинути</button>
      </aside>

      <!-- СЕТКА ДЛЯ 20 ТОВАРОВ -->
      <section id="catalogGrid" class="product-grid"></section>
    </div>
  </div>

  <!-- Окно авторизации -->
  <div id="authModal" class="modal-overlay">
    <div class="modal-box">
      <button class="modal-close" onclick="closeAuthModal()">×</button>
      <div class="auth-tabs">
        <div id="tabLogin" class="auth-tab active" onclick="switchAuthTab('login')">Вхід</div>
        <div id="tabReg" class="auth-tab" onclick="switchAuthTab('reg')">Реєстрація</div>
      </div>
      <form id="formLogin" onsubmit="handleLogin(event)" style="display: grid; gap: 0.8rem;">
        <div class="form-group"><label>Email</label><input type="email" id="loginEmail" required></div>
        <div class="form-group"><label>Пароль</label><input type="password" id="loginPass" required></div>
        <button type="submit" class="btn">Увійти</button>
      </form>
      <form id="formReg" onsubmit="handleRegister(event)" style="display: none; gap: 0.8rem;">
        <div class="form-group"><label>Нікнейм</label><input type="text" id="regNick" required></div>
        <div class="form-group"><label>Email</label><input type="email" id="regEmail" required></div>
        <div class="form-group"><label>Телефон</label><input type="tel" id="regPhone" required></div>
        <div class="form-group"><label>Пароль</label><input type="password" id="regPass" required></div>
        <button type="submit" class="btn">Зареєструватися</button>
      </form>
    </div>
  </div>

  <!-- База данных окно -->
  <div id="dbModal" class="modal-overlay">
    <div class="modal-box" style="max-width: 700px; overflow-x: auto;">
      <button class="modal-close" onclick="closeDbModal()">×</button>
      <h3 style="color: var(--accent); margin-bottom: 0.5rem;">🗄️ База даних користувачів</h3>
      <table class="db-table">
        <thead><tr><th>ID</th><th>Нік</th><th>Email</th><th>Тел</th><th>Пароль</th></tr></thead>
        <tbody id="dbUsersList"></tbody>
      </table>
    </div>
  </div>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="logo">CYBER<span>FORGE</span></div>
      <p>© 2024 CyberForge PC. Всі права захищені.</p>
      <p>Пн-Сб: 10:00 — 20:00</p>
    </div>
  </footer>

  <script src="app.js"></script>

  <!-- Скрипт 20 ПК и динамической фильтрации -->

      { id: 19, title: 'CyberForge Threadripper', category: 'work', price: 152000, cpu: 'TR 7960X 24-Cores', gpu: 'RTX 4090 24GB', ram: '128GB DDR5', ssd: '8TB', img: 'https://images.unsplash.com/photo-1624705002806-5d72df19c3ad?auto=format&fit=crop&w=500&q=80' },
      { id: 20, title: 'CyberForge GODLIKE Extreme', category: 'gaming', price: 169000, cpu: 'Ryzen 9 7950X3D Custom', gpu: 'Dual RTX 4090 Water', ram: '128GB DDR5', ssd: '8TB Gen5', img: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=500&q=80' }
    ];

    // Отрисовка товаров
    function renderProducts(list) {
      const grid = document.getElementById('catalogGrid');
      const count = document.getElementById('countDisplay');
      count.textContent = list.length;

      if (list.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); font-size: 1.2rem; padding: 3rem;">За вашим запитом нічого не знайдено 😔 Спробуйте змінити фільтри цін або параметри.</p>';
        return;
      }

      grid.innerHTML = list.map(item => `
        <article class="product-card">
          <img class="product-img" src="${item.img}" alt="${item.title}">
          <div class="product-info">
            <h3 class="product-title">${item.title}</h3>
            <ul class="specs-list">
              <li>• Процесор: ${item.cpu}</li>
              <li>• Відеокарта: ${item.gpu}</li>
              <li>• ОЗП: ${item.ram}</li>
              <li>• Диск: ${item.ssd}</li>
            </ul>
            <div class="card-bottom">
              <span class="price">${item.price.toLocaleString('uk-UA')} ₴</span>
              <button class="btn btn-sm" onclick="alert('Товар ${item.title} додано до замовлення!')">Купити</button>
            </div>
          </div>
        </article>
      `).join('');
    }

    // Логика фильтрации
    function applyFilters() {
      const search = document.getElementById('searchTxt').value.toLowerCase().trim();
      const cat = document.getElementById('catSelect').value;
      const min = parseFloat(document.getElementById('minPrice').value) || 0;
      const max = parseFloat(document.getElementById('maxPrice').value) || Infinity;

      const filtered = productsData.filter(p => {
        const matchesCategory = (cat === 'all') || (p.category === cat);
        const matchesPrice = (p.price >= min && p.price <= max);
        const fullText = (p.title + ' ' + p.cpu + ' ' + p.gpu).toLowerCase();
        const matchesSearch = !search || fullText.includes(search);

        return matchesCategory && matchesPrice && matchesSearch;
      });

      renderProducts(filtered);
    }

    function resetFilters() {
      document.getElementById('searchTxt').value = '';
      document.getElementById('catSelect').value = 'all';
      document.getElementById('minPrice').value = '';
      document.getElementById('maxPrice').value = '';
      renderProducts(productsData);
    }

    // Инициализация при загрузке
    renderProducts(productsData);
  </script>
</body>
</html>
