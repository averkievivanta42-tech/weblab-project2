<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог ПК — CyberForge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="container nav">
      <a href="index.html" class="logo">CYBER<span>FORGE</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Головна</a></li>
        <li><a href="catalog.html" class="active">Каталог (20 ПК)</a></li>
        <li><a href="order.html">Оформлення</a></li>
        <li><a href="contacts.html">Контакти</a></li>
      </ul>
      <div id="userArea" class="user-panel"></div>
    </div>
  </header>

  <div class="container">
    <h1 style="margin: 2rem 0 0.5rem 0;">Каталог 20 готових комп'ютерів</h1>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">Знайдено конфігурацій: <span id="countDisplay" style="color: var(--accent); font-weight: bold;">20</span></p>

    <div class="catalog-layout">
      <!-- Фільтри -->
      <aside class="filter-sidebar">
        <h3>Фільтри та Пошук</h3>
        
        <div class="filter-group">
          <label for="searchTxt">Пошук комплектуючих (CPU / GPU)</label>
          <input type="text" id="searchTxt" placeholder="Наприклад: RTX 4070 або Ryzen...">
        </div>

        <div class="filter-group">
          <label for="catSelect">Призначення</label>
          <select id="catSelect">
            <option value="all">Усі ПК</option>
            <option value="gaming">Геймерські</option>
            <option value="work">Для роботи / 3D</option>
            <option value="budget">Бюджетні / Офіс</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Ціна в діапазоні (₴)</label>
          <div class="price-inputs">
            <input type="number" id="minPrice" placeholder="Від: 0">
            <input type="number" id="maxPrice" placeholder="До: напр. 33333">
          </div>
        </div>

        <button class="btn" style="width: 100%; margin-bottom: 0.5rem;" onclick="filterCatalog()">Застосувати</button>
        <button class="btn btn-secondary" style="width: 100%;" onclick="resetFilters()">Скинути</button>
      </aside>

      <!-- Сетка 20 ПК -->
      <section id="catalogGrid" class="catalog-grid"></section>
    </div>
  </div>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="logo">CYBER<span>FORGE</span></div>
      <p>© 2024 CyberForge PC. Всі права захищені.</p>
      <p>Пн-Сб: 10:00 — 20:00</p>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    function renderCatalogItems(list) {
      const grid = document.getElementById('catalogGrid');
      const count = document.getElementById('countDisplay');
      count.textContent = list.length;

      if (list.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem;">За вказаними критеріями нічого не знайдено 😔 Змініть діапазон цін або параметри пошуку.</p>';
        return;
      }

      grid.innerHTML = list.map(pc => `
        <article class="product-card">
          <img class="product-img" src="${pc.img}" alt="${pc.title}" onerror="this.src='https://images.unsplash.com/photo-1587202372775-e229f172b9d7?auto=format&fit=crop&w=600&q=80'">
          <div class="product-info">
            <h3 class="product-title">${pc.title}</h3>
            <ul class="specs-list">
              <li>• CPU: ${pc.cpu}</li>
              <li>• GPU: ${pc.gpu}</li>
              <li>• RAM: ${pc.ram}</li>
              <li>• SSD: ${pc.ssd}</li>
            </ul>
            <div class="card-bottom">
              <span class="price">${pc.price.toLocaleString('uk-UA')} ₴</span>
              <button class="btn btn-sm" onclick="buyProduct(${pc.id})">Купити</button>
            </div>
          </div>
        </article>
      `).join('');
    }

    function filterCatalog() {
      const search = document.getElementById('searchTxt').value.toLowerCase().trim();
      const cat = document.getElementById('catSelect').value;
      const min = parseFloat(document.getElementById('minPrice').value) || 0;
      const max = parseFloat(document.getElementById('maxPrice').value) || Infinity;

      const filtered = PRODUCTS_DB.filter(p => {
        const matchesCategory = (cat === 'all') || (p.category === cat);
        const matchesPrice = (p.price >= min && p.price <= max);
        const fullString = (p.title + ' ' + p.cpu + ' ' + p.gpu + ' ' + p.ram).toLowerCase();
        const matchesSearch = !search || fullString.includes(search);
        return matchesCategory && matchesPrice && matchesSearch;
      });

      renderCatalogItems(filtered);
    }

    function resetFilters() {
      document.getElementById('searchTxt').value = '';
      document.getElementById('catSelect').value = 'all';
      document.getElementById('minPrice').value = '';
      document.getElementById('maxPrice').value = '';
      renderCatalogItems(PRODUCTS_DB);
    }

    renderCatalogItems(PRODUCTS_DB);
  </script>
</body>
</html>
